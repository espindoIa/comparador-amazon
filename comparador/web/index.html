<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preços de livros</title>
<meta name="description" content="Histórico de preço dos livros mais vendidos da Amazon.com.br, lido todo dia: quanto um livro custa agora e quanto já custou.">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://m.media-amazon.com">
<link rel="stylesheet" href="estilo.css">
<body>
<header class="hdr">
  <div class="hdr-in">
    <a class="marca" href="./" data-r><img src="icone.svg" alt="" width="30" height="30"><span>Preços de livros</span></a>
    <form class="busca" role="search" action="./">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" name="q" type="search" placeholder="Buscar por título, autor ou ISBN" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Buscar livro">
      <button type="button" class="limpa" id="limpa" aria-label="Limpar busca" hidden><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </form>
    <a class="hdr-lista" href="./?lista" data-r><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span class="rot">Minha lista</span><span class="badge" id="cont"></span></a>
  </div>
</header>
<main class="pg" id="app" tabindex="-1">
  <noscript><p>Este site precisa de JavaScript para buscar os livros e mostrar o histórico de preço.</p></noscript>
</main>
<footer class="rod">
  <span>Preços lidos da Amazon.com.br, sem vínculo com a Amazon. Confira o preço na loja antes de comprar.</span>
  <a href="./?sobre" data-r>Como funciona</a>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="livro.js"></script><script src="lista.js"></script><script src="busca.js"></script><script src="app.js"></script>
</body>
</html>

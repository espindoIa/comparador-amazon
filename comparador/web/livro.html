<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preços de livros</title>
<meta name="robots" content="noindex">
<script>
  // Endereço antigo da página do livro: leva para o mesmo livro no app.
  var a = (new URLSearchParams(location.search).get('asin') || '').toUpperCase();
  location.replace('./' + (/^[A-Z0-9]{10}$/.test(a) ? '?livro=' + a : ''));
</script>
<p><a href="./">Abrir Preços de livros</a></p>
</html>

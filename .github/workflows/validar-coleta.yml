# TEMPORÁRIO (sai antes do merge na main): validação em escala da coleta nova, só leitura.
# Lê 7 gêneros com 9 faixas de preço, no ritmo padrão novo (começa em 21 páginas/min e sobe até o teto
# de 60 programadas), por mais de uma hora, num servidor do GitHub. Não toca na release de produção:
# o banco novo fica só como artefato do workflow, e o de produção é baixado só para comparar.
# Mede: ritmo real sustentado, bloqueios/erros/páginas curtas e quantos livros NOVOS (fora do banco
# de produção) cada página traz com faixas mais estreitas.
# Roda a cada push que altera este arquivo (troque o número da execução abaixo para repetir).
# execução: 1
name: validar-coleta

on:
  push:
    branches: [coleta-rapida]
    paths: [.github/workflows/validar-coleta.yml]

permissions:
  contents: read

concurrency:
  group: validar-coleta
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: "1"
  # Administração; LGBTQ+; Infantil; Medicina; Literatura e Ficção; Fantasia/Horror/FC; Livros Internacionais
  GENEROS: "7872854011,7843064011,7844001011,7874461011,7872687011,7841775011,7882627011"
  FAIXAS: "0,20,30,40,50,60,80,120,200"

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Baixa o banco de produção (só para comparar)
        run: |
          mkdir -p data
          ultimo=$(gh release view catalogo --json assets --jq '.assets[].name' | grep -E '^catalogo-vendidos-[0-9-]+\.db\.gz$' | sort | tail -n 1)
          gh release download catalogo --pattern "$ultimo" --dir "$RUNNER_TEMP"
          gunzip -c "$RUNNER_TEMP/$ultimo" > data/producao.db
          echo "produção: $ultimo"

      - name: Varre (ritmo novo, faixas estreitas)
        run: |
          set -o pipefail
          python -m comparador --db data/validacao.db varrer --vendidos --cliente navegador \
            --generos "$GENEROS" --faixas "$FAIXAS" --minutos 150 | tee log.txt

      - name: Resumo
        if: always()
        run: |
          { echo '### Validação'; echo '```'
            grep -E "^ritmo:|^execução|^atenção|bloqueado|veio com|layout|HTTP|falha de rede|confirmado|leu .* livros" log.txt | awk '!s[$0]++' || true
            echo; python scripts/comparar_bancos.py data/validacao.db data/producao.db || true
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compacta o banco
        if: always()
        run: gzip -9 -k data/validacao.db || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validacao
          path: |
            data/validacao.db.gz
            data/html
            log.txt
          if-no-files-found: ignore

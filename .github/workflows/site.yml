# Publica o site (busca por título, histórico de cada livro e lista de desejos) no GitHub Pages.
# Os dados vêm dos bancos mais recentes na release "catalogo": um por sequência de coleta (vendidos,
# vendidos-b e vendidos-c), que o site junta pelo ASIN. É disparado por varredura.yml depois de cada publicação confirmada
# (um pedido explícito, em vez de esperar o gatilho workflow_run) e roda também uma vez por dia, para o site nunca ficar
# muito atrás dos preços. O grupo de concorrência "pages" junta pedidos repetidos: no máximo um está esperando.
#
# Configuração, uma vez só: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: site

on:
  schedule:
    - cron: "17 10 * * *"     # 07:17 em Brasília
  workflow_dispatch:
    inputs:
      forcar:
        description: "Publicar mesmo se o site novo tiver bem menos livros que o atual"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Sem timeout-minutes de propósito (decisão do dono, 14/10/2026): vale o padrão do GitHub, de 6 h. A geração leva uns
    # 2 a 4 minutos; uma geração travada seguraria o grupo de concorrência "pages" até o padrão acabar.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # O comando importa o módulo da varredura, que usa estas duas bibliotecas (sem o Playwright).
      - run: pip install requests beautifulsoup4

      - name: Baixa os bancos mais recentes (release catalogo)
        run: |
          mkdir -p "$RUNNER_TEMP/bancos"
          for alvo in vendidos vendidos-b vendidos-c; do
            python scripts/catalogo_release.py baixar "$alvo" "$RUNNER_TEMP/bancos/$alvo.db"
          done
          ls "$RUNNER_TEMP"/bancos/*.db > /dev/null   # falha se nenhum banco foi baixado

      # Antes da geração: o endereço público entra na imagem de prévia dos links (og:image).
      - id: pages
        uses: actions/configure-pages@v5

      # Segundo interruptor dos subgêneros (o primeiro liga a coleta, em subgeneros.yml): só com SUBGENEROS_NO_SITE=true o
      # snapshot mais recente entra na conta dos parecidos. Sem snapshot ou com um que não se lê, o site sai como sempre.
      - name: Baixa os subgêneros (opcional)
        if: ${{ vars.SUBGENEROS_NO_SITE == 'true' }}
        run: python scripts/subgeneros_release.py baixar-snapshot "$RUNNER_TEMP/subgeneros.json"

      - name: Gera o site
        run: |
          SUB=()
          if [ -f "$RUNNER_TEMP/subgeneros.json" ]; then SUB=(--subgeneros "$RUNNER_TEMP/subgeneros.json"); fi
          python -m comparador site "$RUNNER_TEMP"/bancos/*.db --saida site --url "${{ steps.pages.outputs.base_url }}" "${SUB[@]}"

      # Um banco incompleto ou um erro na geração não pode trocar o site bom por um quase vazio.
      - name: Confere se o site não encolheu
        if: ${{ !inputs.forcar }}
        run: |
          if ! curl -fsS -m 30 --retry 2 -o "$RUNNER_TEMP/meta-atual.json" "${{ steps.pages.outputs.base_url }}/dados/meta.json"; then
            echo "sem o meta.json do site no ar (primeira publicação?); seguindo"
            rm -f "$RUNNER_TEMP/meta-atual.json"
          fi
          python scripts/conferir_site.py site/dados/meta.json "$RUNNER_TEMP/meta-atual.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

# Publica o site (busca por título, histórico de cada livro e lista de desejos) no GitHub Pages.
# Os dados vêm dos bancos mais recentes na release "catalogo". Roda depois de cada varredura e
# uma vez por dia, para o site nunca ficar muito atrás dos preços.
#
# Configuração, uma vez só: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: site

on:
  workflow_run:
    workflows: [varredura]
    types: [completed]
  schedule:
    - cron: "17 10 * * *"     # 07:17 em Brasília
  workflow_dispatch:
    inputs:
      forcar:
        description: "Publicar mesmo se o site novo tiver bem menos livros que o atual"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # O comando importa o módulo da varredura, que usa estas duas bibliotecas (sem o Playwright).
      - run: pip install requests beautifulsoup4

      - name: Baixa os bancos mais recentes (release catalogo)
        run: |
          mkdir -p "$RUNNER_TEMP/bancos"
          for alvo in vendidos; do
            python scripts/catalogo_release.py baixar "$alvo" "$RUNNER_TEMP/bancos/$alvo.db"
          done
          ls "$RUNNER_TEMP"/bancos/*.db > /dev/null   # falha se nenhum banco foi baixado

      - name: Gera o site
        run: python -m comparador site "$RUNNER_TEMP"/bancos/*.db --saida site

      - id: pages
        uses: actions/configure-pages@v5

      # Um banco incompleto ou um erro na geração não pode trocar o site bom por um quase vazio.
      - name: Confere se o site não encolheu
        if: ${{ !inputs.forcar }}
        run: |
          if ! curl -fsS -m 30 --retry 2 -o "$RUNNER_TEMP/meta-atual.json" "${{ steps.pages.outputs.base_url }}/dados/meta.json"; then
            echo "sem o meta.json do site no ar (primeira publicação?); seguindo"
            rm -f "$RUNNER_TEMP/meta-atual.json"
          fi
          python scripts/conferir_site.py site/dados/meta.json "$RUNNER_TEMP/meta-atual.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

# Coleta diária de preços, sem precisar de computador ligado.
#
# Por que 5 agendamentos por dia? O cron do GitHub pode atrasar ou pular execuções,
# e a Amazon às vezes bloqueia. Cada execução só coleta se o dia (horário de
# Brasília) ainda NÃO tiver uma coleta completa (--uma-por-dia); as demais terminam
# em segundos. Assim, uma falha às 05h é refeita às 09h, 14h, 19h e 23h.
#
# O banco fica na branch `dados` (arquivo precos.db), separada do código.
name: coleta

on:
  schedule:            # horários em UTC (Brasília = UTC-3)
    - cron: "17 8 * * *"    # 05:17
    - cron: "43 12 * * *"   # 09:43
    - cron: "11 17 * * *"   # 14:11
    - cron: "37 22 * * *"   # 19:37
    - cron: "23 2 * * *"    # 23:23 (última chance do dia)
  workflow_dispatch:
    inputs:
      forcar:
        description: "Coletar mesmo que o dia já tenha coleta completa"
        type: boolean
        default: false
      teste_asin:
        description: "Diagnóstico: coleta só este ASIN num banco descartável (não toca nos dados)"
        type: string
        default: ""

permissions:
  contents: write

# Uma execução por vez: duas não podem gravar o banco ao mesmo tempo.
concurrency:
  group: coleta
  cancel-in-progress: false

env:
  DB: dados/precos.db

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Diagnóstico (ASIN avulso, banco descartável)
        if: inputs.teste_asin != ''
        env:
          ASIN: ${{ inputs.teste_asin }}
        run: |
          echo "$ASIN" > "$RUNNER_TEMP/livros.txt"
          python -m comparador --db "$RUNNER_TEMP/teste.db" coletar --lista "$RUNNER_TEMP/livros.txt" \
            --desejos-arquivo /dev/null --sem-html --detalhar todos

      - name: Baixa o banco (branch dados)
        if: inputs.teste_asin == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" dados >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch dados "$URL" dados
          else
            echo "branch dados ainda não existe; será criada"
            mkdir dados
            git -C dados init --quiet -b dados
            git -C dados remote add origin "$URL"
          fi

      - name: Coleta
        if: inputs.teste_asin == ''
        env:
          LISTA_DESEJOS: ${{ secrets.LISTA_DESEJOS }}
          FORCAR: ${{ inputs.forcar }}
        run: |
          python -m comparador --db "$DB" init
          ARGS=(--sem-html)
          [ "$FORCAR" != "true" ] && ARGS+=(--uma-por-dia)
          [ -n "$LISTA_DESEJOS" ] && ARGS+=(--desejos "$LISTA_DESEJOS")
          python -m comparador --db "$DB" coletar "${ARGS[@]}"

      # Roda mesmo se a coleta falhou: guarda o que foi coletado até ali.
      - name: Salva o banco na branch dados
        if: always() && inputs.teste_asin == ''
        run: |
          cd dados
          [ -f precos.db ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precos.db
          git diff --cached --quiet && { echo "banco sem mudanças"; exit 0; }
          git commit --quiet -m "coleta $(date -u +'%Y-%m-%d %H:%M')Z"
          for tentativa in 1 2 3 4; do
            git push --quiet origin HEAD:dados && exit 0
            sleep $((2 ** tentativa))
            git pull --quiet --rebase origin dados || true
          done
          echo "não consegui enviar o banco" >&2
          exit 1

      - name: Resumo
        if: always() && inputs.teste_asin == ''
        run: |
          {
            echo '```'
            python -m comparador --db "$DB" status 2>/dev/null | head -n 6
            python -m comparador --db "$DB" lacunas 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Opcional: https://healthchecks.io avisa por e-mail se NENHUM aviso chegar em 1 dia
      # (cobre o caso em que o próprio GitHub deixa de rodar o agendamento).
      - name: Avisa o healthchecks.io
        if: always() && inputs.teste_asin == ''
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          RESULTADO: ${{ job.status }}
        run: |
          [ -n "$HC_URL" ] || exit 0
          [ "$RESULTADO" = "success" ] || HC_URL="${HC_URL%/}/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL"

# Varredura DIÁRIA dos mais vendidos ("vendidos"): os ~2.000 livros mais vendidos (com preço de
# compra) de cada um dos 29 gêneros de Livros e do ranking geral. A Amazon só mostra 75 páginas
# na ordem "mais vendidos", mas cada faixa de preço tem o seu ranking: cada categoria é lida em
# 9 faixas (R$ 0–19,99 / 20–29,99 / 30–39,99 / 40–49,99 / 50–59,99 / 60–79,99 / 80–119,99 / 120–199,99 /
# 200+), e cada faixa para ao completar 1.000 livros
# disponíveis ou ao chegar à página 75. Livros sem preço (indisponíveis, só Kindle Unlimited)
# não entram; se voltarem a aparecer com preço em outro dia, entram na base nesse dia.
# A categoria inteira de HQs e mangás NÃO é mais varrida à parte (os HQs mais vendidos
# continuam entrando como um dos gêneros).
# Ritmo programado (comparador/ritmo.py): começa em 21 páginas/min e sobe até 60 programadas (~50 reais)
# enquanto não há falha; recua em bloqueio ou página curta. Medido em out/2026: 0 bloqueios e 1 página curta
# em ~5.100 páginas. São ~12 mil páginas por dia (estimativa), ~4h30; com 3 faixas eram ~5.700, ~2 h.
#
# Robustez:
# - 4 horários por dia. Os três primeiros normalmente completam o dia; os outros só continuam o
#   que faltou (o progresso é salvo a cada página) ou terminam em segundos.
# - Cada categoria roda num servidor separado (matrix), com IP diferente.
# - O banco fica em assets da release "catalogo" (não no git): cada execução publica uma
#   cópia nova com data no nome e só então apaga as antigas. Ficam as 14 mais recentes e a
#   última de cada um dos 30 dias anteriores (scripts/podar_copias.py; ~10–20 MB cada).
# - Uma execução que termina limpa com o dia incompleto dispara a próxima (scripts/encadear.py), até 5 seguidas:
#   o dia fecha sem esperar o horário agendado, que o GitHub atrasa em horas. Os 4 horários ficam como rede de
#   segurança e terminam em segundos se o dia já está completo.
# - O teto de ritmo fica no banco e sobe sozinho, 25% por dia limpo até 90 páginas/min programadas.
# - Orçamento de 165 min por execução (o job tem 180): download e publicação levam segundos.
# - O download usa a cópia mais recente que passa nas conferências (gzip inteiro, SQLite íntegro) e a publicação
#   confere o tamanho no GitHub e repete o envio cortado (scripts/catalogo_release.py).
# - A primeira execução do dia falha (e o GitHub avisa por e-mail) se ONTEM ficou incompleto.
# - Qualquer execução falha se os cards vierem sem capa ou autor (sinal de layout novo da Amazon).
name: varredura

on:
  schedule:            # horários em UTC (Brasília = UTC-3)
    - cron: "41 3 * * *"    # 00:41 (também confere se ontem ficou completo)
    - cron: "41 9 * * *"    # 06:41
    - cron: "41 15 * * *"   # 12:41
    - cron: "41 21 * * *"   # 18:41
  workflow_dispatch:
    inputs:
      minutos:
        description: "Orçamento de tempo, em minutos"
        default: "165"
      encadeadas:
        description: "Uso interno: quantas execuções seguidas já foram encadeadas antes desta"
        default: "0"
      forcar_precos:
        description: "Publicar mesmo se a trava de preços em massa recusar (só depois de conferir que a mudança é real)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write       # para disparar a próxima execução (passo "Continua o dia")

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: "1"   # log em tempo real (não se perde se o job for cortado)
  PRIMEIRA_DO_DIA: ${{ github.event.schedule == '41 3 * * *' }}

jobs:
  varrer:
    strategy:
      fail-fast: false
      matrix:
        # "vendidos" = mais vendidos por gênero; um número seria uma categoria inteira, fatiada
        # por preço (python -m comparador varrer --no NÓ), hoje não usada.
        alvo: ["vendidos"]
    concurrency:
      group: varredura-${{ matrix.alvo }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ALVO: ${{ matrix.alvo }}
      DB: data/catalogo-${{ matrix.alvo }}.db
      FORCAR_PRECOS: ${{ inputs.forcar_precos && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # scripts/catalogo_release.py: tenta de novo o download e, se a cópia mais nova estiver quebrada
      # (upload cortado), usa a anterior. Só começa do zero se a release comprovadamente não tem banco.
      - name: Baixa o catálogo (release catalogo)
        run: |
          mkdir -p data
          python scripts/catalogo_release.py baixar "$ALVO" "$DB"
          if [ -f "$DB" ]; then cp "$DB" "$RUNNER_TEMP/antes.db"; fi

      - name: Varre
        env:
          MINUTOS: ${{ inputs.minutos || '165' }}
        run: |
          if [ "$ALVO" = vendidos ]; then QUAL=(--vendidos); else QUAL=(--no "$ALVO"); fi
          echo "INICIO_RUN=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"
          python -m comparador --db "$DB" varrer "${QUAL[@]}" --minutos "$MINUTOS" --cliente navegador

      # Roda mesmo se a varredura falhou: o progresso até ali fica salvo.
      - name: Publica o catálogo
        id: publica
        if: always()
        run: |
          [ -f "$DB" ] || exit 0
          if [ -f "$RUNNER_TEMP/antes.db" ] && cmp -s "$DB" "$RUNNER_TEMP/antes.db"; then
            echo "banco sem mudanças; nada a publicar"
            exit 0
          fi
          ANTES=""; [ -f "$RUNNER_TEMP/antes.db" ] && ANTES="$RUNNER_TEMP/antes.db"
          python scripts/verificar_banco.py "$DB" $ANTES --tabela catalogo --tabela historico --tabela dias --tabela generos
          # Erro de leitura de preço (reais lidos como centavos, preço de capa no lugar do preço) mudaria quase todos
          # os preços de uma vez: recusa a publicação e a release fica com a última cópia boa.
          python scripts/verificar_precos.py "$DB" $ANTES ${FORCAR_PRECOS:+--forcar}
          # Envia, confere no GitHub (estado e tamanho) e repete se veio cortado; só então apaga as cópias antigas.
          python scripts/catalogo_release.py publicar "$ALVO" "$DB"
          # Só depois do upload: apaga as cópias desta categoria que não precisam ficar
          # (e as de testes antigos, sem a categoria no nome).
          gh release view catalogo --json assets --jq '.assets[].name' \
            | python scripts/podar_copias.py --alvo "$ALVO" \
            | while read -r velho; do gh release delete-asset catalogo "$velho" --yes; done

      # Só depois de uma publicação confirmada (senão a próxima execução baixaria uma cópia mais velha e o
      # trabalho desta se perderia). A decisão fica em scripts/encadear.py: dia incompleto, execução limpa e
      # no máximo 5 seguidas. Os horários agendados continuam como rede de segurança.
      - name: Continua o dia (dispara a próxima execução)
        if: ${{ always() && steps.publica.outcome == 'success' }}
        env:
          ENCADEADAS: ${{ inputs.encadeadas || '0' }}
          REF: ${{ github.ref_name }}
        run: |
          [ "$ALVO" = vendidos ] && [ -f "$DB" ] && [ -n "$INICIO_RUN" ] || exit 0
          codigo=0
          saida=$(python scripts/encadear.py "$DB" --desde "$INICIO_RUN" --encadeadas "$ENCADEADAS") || codigo=$?
          echo "$saida" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$codigo" -eq 0 ]; then
            gh workflow run varredura.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f encadeadas="$((ENCADEADAS + 1))"
            echo "próxima execução disparada ($((ENCADEADAS + 1)) seguida)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cobertura
        if: always()
        run: |
          set -o pipefail   # sem isso, o "| tee" esconderia a falha do alerta
          [ -f "$DB" ] || exit 0
          EXIGIR=""; [ "$PRIMEIRA_DO_DIA" = "true" ] && EXIGIR="--exigir-ontem"
          if [ "$ALVO" = vendidos ]; then QUAL=(--vendidos); else QUAL=(--no "$ALVO"); fi
          python -m comparador --db "$DB" catalogo "${QUAL[@]}" $EXIGIR --exigir-detalhes | tee -a "$GITHUB_STEP_SUMMARY"

      # Opcional: check no healthchecks.io (período 1 dia, tolerância 1 dia).
      - name: Avisa o healthchecks.io
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL_VARREDURA }}
          RESULTADO: ${{ job.status }}
        run: |
          [ -n "$HC_URL" ] || exit 0
          [ "$RESULTADO" = "success" ] || HC_URL="${HC_URL%/}/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL"

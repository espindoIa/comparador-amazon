# Coleta dos preços dos mais vendidos ("vendidos"): os ~2.000 livros mais vendidos (com preço de compra) de cada um
# dos 29 gêneros de Livros (o ranking geral de Livros não é lido: custava 4,9% das páginas para 0,29% dos livros).
# A Amazon só mostra 75 páginas na ordem "mais vendidos", mas cada faixa de preço tem o seu ranking: cada gênero é lido
# em 9 faixas (R$ 0–19,99 / 20–29,99 / 30–39,99 / 40–49,99 / 50–59,99 / 60–79,99 / 80–119,99 / 120–199,99 / 200+), e cada
# faixa para ao completar 1.000 livros disponíveis ou ao chegar à página 75. Livros sem preço (indisponíveis, só Kindle
# Unlimited) não entram; se voltarem a aparecer com preço em outro dia, entram na base nesse dia. São ~13 mil páginas por
# passada completa (13/10/2026: 13.795, 675 delas no ranking geral).
#
# Três sequências em paralelo: os 29 gêneros estão divididos em três grupos de ~4,4 mil páginas
# (comparador.varredura.PARTICOES_VENDIDOS), cada um num servidor do GitHub (job da matrix), com banco, teto de ritmo e
# ciclo próprios. Cada servidor tem o seu IP, e é isso que permite ler em paralelo: a carga sobre a Amazon é três vezes
# a de uma sequência só, em cada instante.
#
# Um ciclo é o tempo entre duas passadas completas do catálogo (comparador/ritmo.py: 3, 6, 12 ou 24 h). O objetivo é 3 h
# (8 passadas por dia, ~105 mil páginas por dia no total), mas o volume mais alto medido sem bloqueio foi 12,6 mil páginas
# por dia. Por isso o ciclo é um degrau guardado no banco: começa em 12 h, desce um degrau por dia limpo, sobe quando há
# bloqueio ou aperto (muitas páginas curtas) e vai direto ao diário depois de bloqueios seguidos. Depois de um bloqueio a
# pausa é de horas (3 h, dobrando): cada execução cai num servidor novo, com outro IP, então tentar de novo logo
# seria trocar de IP por causa do bloqueio. Nada aqui reage a bloqueio trocando de servidor ou de identidade.
# O ritmo de cada sequência é limitado a TETO_POR_SEQUENCIA páginas por minuto programadas (menor que o das versões de
# uma passada por dia, porque o volume diário é até 8 vezes maior).
#
# O anel de execuções não depende do cron do GitHub, que atrasa em horas: ao fim de cada execução, o passo "Agenda o
# próximo ciclo" (scripts/proximo_ciclo.py) dispara espera.yml com o instante da próxima leitura; ela dorme em saltos e
# dispara este workflow de novo. O vigia.yml, a cada 30 min, reinicia uma sequência que ficou sem anel.
# A variável de repositório COLETA_PAUSADA=true interrompe o anel (a execução em andamento termina).
#
# Robustez:
# - O banco fica em assets da release "catalogo" (não no git): cada execução publica uma cópia nova com data no nome e só
#   então apaga as antigas. Ficam as 14 mais recentes e a última de cada um dos 30 dias anteriores
#   (scripts/podar_copias.py; ~10–20 MB cada).
# - Orçamento de 165 min por execução (o job tem 180): download e publicação levam segundos. Se a janela do ciclo não
#   fechou e a execução terminou limpa, a seguinte começa logo.
# - O download usa a cópia mais recente que passa nas conferências (gzip inteiro, SQLite íntegro) e a publicação
#   confere o tamanho no GitHub e repete o envio cortado (scripts/catalogo_release.py).
# - O site é atualizado (site.yml) depois de cada publicação confirmada.
# - Falha (e o GitHub avisa por e-mail) se, na primeira execução do dia, ONTEM ficou incompleto, ou se alguma fatia
#   está sem passada completa há mais de 2 ciclos e 2 h, ou se os cards vierem sem capa ou autor (layout novo).
name: varredura
run-name: varredura ${{ inputs.alvo || 'todas' }}

on:
  # Rede de segurança do anel: uma vez por dia (00:41 de Brasília, quando também se confere se ontem ficou completo). Com o
  # anel funcionando, é uma leitura dentro da janela (ou nenhuma, se ela já fechou) e o anel segue em uma só linha; sem
  # ele, é a coleta diária de antes. O cron do GitHub atrasa em horas, por isso não é ele quem manda.
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      alvo:
        description: "Só esta sequência (vendidos, vendidos-b ou vendidos-c); vazio = as três"
        default: ""
      minutos:
        description: "Orçamento de tempo, em minutos"
        default: "165"
      forcar_precos:
        description: "Publicar mesmo se a trava de preços em massa recusar (só depois de conferir que a mudança é real)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write       # para disparar o site e o próximo ciclo

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: "1"   # log em tempo real (não se perde se o job for cortado)
  COLETA_PAUSADA: ${{ vars.COLETA_PAUSADA }}

jobs:
  varrer:
    strategy:
      fail-fast: false
      matrix:
        # Cada alvo é uma sequência de coleta (um terço dos gêneros, comparador.varredura.PARTICOES_VENDIDOS) com
        # banco próprio. Um número seria uma categoria inteira, fatiada por preço (python -m comparador varrer --no NÓ),
        # hoje não usada. Disparado pelo anel ou à mão com `alvo`, roda só aquela sequência.
        alvo: ${{ fromJSON(inputs.alvo && format('["{0}"]', inputs.alvo) || '["vendidos","vendidos-b","vendidos-c"]') }}
    concurrency:
      group: varredura-${{ matrix.alvo }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ALVO: ${{ matrix.alvo }}
      DB: data/catalogo-${{ matrix.alvo }}.db
      FORCAR_PRECOS: ${{ inputs.forcar_precos && '1' || '' }}
      # Páginas por minuto programadas que o teto de CADA sequência pode alcançar (o real fica ~10-20% abaixo). Menor
      # que os 60 medidos sem bloqueio, porque o volume diário é até 8 vezes maior; subir isto multiplica a carga por três.
      TETO_POR_SEQUENCIA: "45"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # scripts/catalogo_release.py: tenta de novo o download e, se a cópia mais nova estiver quebrada
      # (upload cortado), usa a anterior. Só começa do zero se a release comprovadamente não tem banco.
      - name: Baixa o catálogo (release catalogo)
        run: |
          mkdir -p data
          python scripts/catalogo_release.py baixar "$ALVO" "$DB"
          if [ -f "$DB" ]; then cp "$DB" "$RUNNER_TEMP/antes.db"; fi

      # O ciclo e a pausa vêm do banco. Em pausa (depois de um bloqueio) a execução termina sem ler nada.
      - name: Varre
        env:
          MINUTOS: ${{ inputs.minutos || '165' }}
        run: |
          case "$ALVO" in
            vendidos|vendidos-b|vendidos-c) QUAL=(--vendidos --particao "$ALVO") ;;
            *) QUAL=(--no "$ALVO") ;;
          esac
          echo "INICIO_RUN=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"
          python -m comparador --db "$DB" varrer "${QUAL[@]}" --teto-auto-max "$TETO_POR_SEQUENCIA" --minutos "$MINUTOS" --cliente navegador

      # Roda mesmo se a varredura falhou: o progresso até ali fica salvo.
      - name: Publica o catálogo
        id: publica
        if: always()
        run: |
          [ -f "$DB" ] || exit 0
          if [ -f "$RUNNER_TEMP/antes.db" ] && cmp -s "$DB" "$RUNNER_TEMP/antes.db"; then
            echo "banco sem mudanças; nada a publicar"
            exit 0
          fi
          ANTES=""; [ -f "$RUNNER_TEMP/antes.db" ] && ANTES="$RUNNER_TEMP/antes.db"
          python scripts/verificar_banco.py "$DB" $ANTES --tabela catalogo --tabela historico --tabela dias --tabela generos
          # Erro de leitura de preço (reais lidos como centavos, preço de capa no lugar do preço) mudaria quase todos
          # os preços de uma vez: recusa a publicação e a release fica com a última cópia boa.
          python scripts/verificar_precos.py "$DB" $ANTES ${FORCAR_PRECOS:+--forcar}
          # Envia, confere no GitHub (estado e tamanho) e repete se veio cortado; só então apaga as cópias antigas.
          python scripts/catalogo_release.py publicar "$ALVO" "$DB"
          echo "publicou=1" >> "$GITHUB_OUTPUT"
          echo "$ALVO: banco com $(du -m "$DB" | cut -f1) MB" >> "$GITHUB_STEP_SUMMARY"
          # Só depois do upload: apaga as cópias desta categoria que não precisam ficar
          # (e as de testes antigos, sem a categoria no nome).
          gh release view catalogo --json assets --jq '.assets[].name' \
            | python scripts/podar_copias.py --alvo "$ALVO" \
            | while read -r velho; do gh release delete-asset catalogo "$velho" --yes; done

      # O site é gerado com os bancos publicados; o pedido explícito não depende do gatilho workflow_run, que não
      # distingue execução que publicou de execução que não fez nada. O grupo de concorrência "pages" junta pedidos repetidos.
      - name: Atualiza o site
        if: ${{ always() && steps.publica.outputs.publicou == '1' }}
        env:
          REF: ${{ github.ref_name }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref "$REF"

      # scripts/proximo_ciclo.py decide o instante: agora, se a janela do ciclo não fechou e esta execução terminou limpa;
      # senão, a próxima janela (ou o fim da pausa depois de bloqueio). Se a publicação falhou, o que foi lido se perdeu:
      # ler de novo logo só repetiria o pedido à Amazon, então a próxima leitura espera algumas horas. Se este passo ou a
      # espera falharem, o vigia reinicia a sequência em até ~1 h.
      - name: Agenda o próximo ciclo
        if: ${{ !cancelled() && env.COLETA_PAUSADA != 'true' }}
        env:
          REF: ${{ github.ref_name }}
          PUBLICACAO: ${{ steps.publica.outcome }}
        run: |
          case "$ALVO" in vendidos|vendidos-b|vendidos-c) ;; *) exit 0 ;; esac
          [ -f "$DB" ] && [ -n "$INICIO_RUN" ] || exit 0
          FALHOU=""; [ "$PUBLICACAO" = success ] || FALHOU="--publicacao-falhou"
          mapfile -t R < <(python scripts/proximo_ciclo.py "$DB" --alvo "$ALVO" --inicio-run "$INICIO_RUN" $FALHOU)
          [ -n "${R[0]}" ] || { echo "proximo_ciclo.py não devolveu o instante da próxima leitura"; exit 1; }
          echo "$ALVO: próxima leitura em ${R[0]} (${R[1]})" | tee -a "$GITHUB_STEP_SUMMARY"
          gh workflow run espera.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f alvo="$ALVO" -f quando="${R[0]}"

      - name: Cobertura
        if: always()
        run: |
          set -o pipefail   # sem isso, o "| tee" esconderia a falha do alerta
          [ -f "$DB" ] || exit 0
          # "ontem incompleto" só é alertado na primeira execução do dia (antes das 03:00 de Brasília): nas outras, o
          # alerta se repetiria a cada ciclo.
          EXIGIR=""; [ "$(TZ=America/Sao_Paulo date +%-H)" -lt 3 ] && EXIGIR="--exigir-ontem"
          case "$ALVO" in vendidos*) QUAL=(--vendidos) ;; *) QUAL=(--no "$ALVO") ;; esac
          echo "### $ALVO" >> "$GITHUB_STEP_SUMMARY"
          python -m comparador --db "$DB" catalogo "${QUAL[@]}" $EXIGIR --exigir-frescor --exigir-detalhes | tee -a "$GITHUB_STEP_SUMMARY"

  # Um só aviso para as três sequências, depois de todas: se cada uma avisasse por conta própria, o sucesso de
  # uma apagaria a falha de outra.
  avisa:
    needs: varrer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Opcional: check no healthchecks.io (período 1 dia, tolerância 1 dia).
      - name: Avisa o healthchecks.io
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL_VARREDURA }}
          RESULTADO: ${{ needs.varrer.result }}
        run: |
          [ -n "$HC_URL" ] || exit 0
          [ "$RESULTADO" = "success" ] || HC_URL="${HC_URL%/}/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL"
